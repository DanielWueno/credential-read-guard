# Fixture de demostracion. Todos los valores son ficticios.
#
# Documento 1 -- kind: Secret. Prueba dos huecos de redactFile() que no
# dependen del nombre de la clave:
#   - Regla 1: bloques data:/stringData: de un Secret son secretos SIEMPRE,
#     sin importar como se llame la clave -- aqui "app-config.json" y
#     "custom_flag" no matchean ninguna heuristica de nombre sensible.
#   - Regla 2: un escalar multilinea ("tls.key: |") bajo una clave que ya se
#     redacta por nombre (ademas de estar dentro del bloque de Secret) --
#     el valor real vive en las lineas siguientes, indentadas.
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
type: Opaque
data:
  app-config.json: ZmFrZS1iYXNlNjQtdmFsdWUtbm8tcmVhbC1zZWNyZXQ=
  custom_flag: ZmFrZS1mbGFnLXZhbHVlLW5vLXJlYWw=
stringData:
  app-config.json: "config de ejemplo no sensible en texto plano"
  custom_flag: "valor-de-ejemplo-no-sensible-en-texto-plano"
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    ZmFrZUtleUxpbmVPbmVOb1JlYWxTZWNyZXRNYXRlcmlhbA==
    ZmFrZUtleUxpbmVUd29BbHNvTm90UmVhbA==
    -----END PRIVATE KEY-----
---
# Documento 2 -- kind: ConfigMap. El estado del documento anterior (Secret)
# NO debe arrastrarse: esta misma clave "data:" en un recurso que no es
# Secret tiene que seguir con la logica normal (redactar solo por nombre de
# clave), asi que este contenido no sensible debe seguir visible.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-configmap
data:
  info: este texto no es sensible y debe seguir visible
